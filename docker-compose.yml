# PaperPilot AI server behind Caddy (automatic HTTPS).
#   1. Point a DNS name at the VPS and put it in Caddyfile (replace ai.example.com).
#   2. Put upstream provider keys in .env.server (GROQ_API_KEY=…, OPENROUTER_API_KEY=…).
#   3. docker compose up -d --build
#   4. docker compose exec app node scripts/pp-keys.mjs create "first user" --daily 200
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.server
    volumes:
      - paperpilot-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
volumes:
  paperpilot-data:
  caddy-data:
